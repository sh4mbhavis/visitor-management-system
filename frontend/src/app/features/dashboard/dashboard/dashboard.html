<div class="container-fluid p-4">

  <h2 class="mb-4">Visitor Management Dashboard</h2>

  <div class="row g-4" *ngIf="stats">

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6>Total Visitors</h6>
          <h2>{{ stats.totalVisitors }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6>Total Visits</h6>
          <h2>{{ stats.totalVisits }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6>Active Visits</h6>
          <h2>{{ stats.activeVisits }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6>Approved Visits</h6>
          <h2>{{ stats.approvedVisits }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6>Rejected Visits</h6>
          <h2>{{ stats.rejectedVisits }}</h2>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow-sm border-0">
        <div class="card-body">
          <h6>Pending Approvals</h6>
          <h2>{{ stats.pendingApprovals }}</h2>
        </div>
      </div>
    </div>

  </div>

</div>
