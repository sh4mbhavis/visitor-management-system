<div class="container">

  <div class="card shadow">

    <div class="card-header">
      <h3>Edit Department</h3>
    </div>

    <div class="card-body">

      <form
        [formGroup]="departmentForm"
        (ngSubmit)="onSubmit()">

        <div class="mb-3">

          <label class="form-label">
            Department Name
          </label>

          <input
            type="text"
            class="form-control"
            formControlName="departmentName">

        </div>

        <div class="mb-3">

          <label class="form-label">
            Department Code
          </label>

          <input
            type="text"
            class="form-control"
            formControlName="departmentCode">

        </div>

        <button
          type="submit"
          class="btn btn-primary">

          Update Department

        </button>

      </form>

    </div>

  </div>

</div>
