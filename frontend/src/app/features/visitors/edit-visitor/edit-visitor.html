<div class="container-fluid">

  <div class="card shadow-sm">

    <div class="card-header">
      <h3>Edit Visitor</h3>
    </div>

    <div class="card-body">

      <form
        [formGroup]="visitorForm"
        (ngSubmit)="onSubmit()">

        <div class="mb-3">
          <label>Full Name</label>
          <input
            class="form-control"
            formControlName="fullName">
        </div>

        <div class="mb-3">
          <label>Mobile</label>
          <input
            class="form-control"
            formControlName="mobile">
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input
            class="form-control"
            formControlName="email">
        </div>

        <div class="mb-3">
          <label>Gender</label>
          <input
            class="form-control"
            formControlName="gender">
        </div>

        <div class="mb-3">
          <label>Address</label>
          <textarea
            class="form-control"
            formControlName="address">
          </textarea>
        </div>

        <div class="mb-3">
          <label>ID Proof Type</label>
          <input
            class="form-control"
            formControlName="idProofType">
        </div>

        <div class="mb-3">
          <label>ID Proof Number</label>
          <input
            class="form-control"
            formControlName="idProofNumber">
        </div>

        <button
          type="submit"
          class="btn btn-primary">
          Update Visitor
        </button>

      </form>

    </div>

  </div>

</div>
